[project]
name = "agentic-sdlc"
version = "0.1.0"
description = "The simplest useful guarded coding agent: issue -> plan -> code -> review -> human-approved draft PR."
readme = "README.md"
requires-python = ">=3.11"
license = { text = "Apache-2.0" }
# Keep in sync with requirements.txt.
dependencies = [
  # Agent framework (LLM-agnostic).
  # Written against the pydantic-ai 1.x API (Agent, output_type, RunContext, UsageLimits).
  "pydantic-ai-slim[openai,anthropic]>=1.0,<2",
  "pydantic>=2.7",
  "jinja2>=3.1",          # prompt templates (PromptService)
  "pyyaml>=6.0",
  "python-dotenv>=1.0",
  "python-json-logger>=2.0",
  "httpx>=0.27",          # GitHub REST (draft PR)
  "nemoguardrails>=0.11", # input/output rails (Colang flows + self-check prompts)
  "guardrails-ai>=0.5",   # validators on generated code (tool-argument validation)
]

[project.optional-dependencies]
ui = ["streamlit>=1.38"]
dev = ["pytest>=8", "pytest-asyncio>=0.23", "ruff>=0.5"]
observability = ["logfire>=2.0"]   # optional: hosted traces of every agent run and tool call
phoenix = ["arize-phoenix-otel"]    # optional: self-hosted traces (Arize Phoenix)
redteam = ["deepteam", "deepeval"]  # optional: OWASP ASI 2026 red team (evals/redteam_owasp_asi.py)

[project.scripts]
agentic-sdlc = "agentic_sdlc.cli:main"

[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[tool.setuptools.packages.find]
include = ["agentic_sdlc*"]

[tool.pytest.ini_options]
asyncio_mode = "auto"
testpaths = ["tests"]

[tool.ruff]
line-length = 110
