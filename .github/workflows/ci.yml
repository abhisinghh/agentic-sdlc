name: ci
on:
  pull_request:
  push:
    branches: [main]
permissions:
  contents: read
jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with: { python-version: "3.12" }
      - run: pip install -r requirements.txt
      - run: ruff check agentic_sdlc tests app
      - run: pytest -q     # scripted models: no API keys, sandbox off; includes the attack scenarios
      - run: agentic-sdlc eval --min-pass-rate 1.0   # security benchmark gate (attacks + false positives)
      - uses: actions/upload-artifact@v4
        if: always()
        with: { name: eval-results, path: logs/eval_results.csv }
